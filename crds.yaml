# The two types this extension is a UI over.
#
# They are applied to the cluster once, out of band - an extension is UI and does not install
# its own CRDs on every page load. Apply with:
#
#   kubectl apply -f crds.yaml
#
# Neither has a controller. An AppInstance is turned into a Fleet Bundle by the model when it
# is saved (models/appsplus.io.appinstance.js), and Fleet's controllers do the rest.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.appsplus.io
spec:
  group: appsplus.io
  scope: Cluster
  names:
    kind: App
    plural: apps
    singular: app
    shortNames: [apapp]
    categories: [appsplus]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Templates
          type: integer
          jsonPath: .status.templateCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                displayName:
                  type: string
                  description: Human readable name shown as the group header in the list.
                description:
                  type: string
                templates:
                  type: array
                  description: The chart. Each entry is one YAML file applied to every target.
                  items:
                    type: object
                    required: [name, content]
                    properties:
                      name:
                        type: string
                      content:
                        type: string
                values:
                  type: object
                  description: Default values, substituted into templates as ${key}.
                  x-kubernetes-preserve-unknown-fields: true
                defaultNamespace:
                  type: string
                defaultTargets:
                  type: array
                  items:
                    type: object
                    properties:
                      clusterName:
                        type: string
                clusterTemplate:
                  type: string
                  description: YAML for a cluster to provision when an instance asks for a new one. Not yet acted on.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appinstances.appsplus.io
spec:
  group: appsplus.io
  scope: Cluster
  names:
    kind: AppInstance
    plural: appinstances
    singular: appinstance
    shortNames: [apinst]
    categories: [appsplus]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: App
          type: string
          jsonPath: .spec.app
        - name: Namespace
          type: string
          jsonPath: .spec.namespace
        - name: Bundle
          type: string
          jsonPath: .status.bundleName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [app]
              properties:
                app:
                  type: string
                  description: Name of the App this is an instance of.
                namespace:
                  type: string
                  description: Namespace the rendered resources land in on each target.
                values:
                  type: object
                  description: Overrides the App's values. Substituted into templates as ${key}.
                  x-kubernetes-preserve-unknown-fields: true
                targets:
                  type: array
                  description: Which existing clusters to deploy to.
                  items:
                    type: object
                    properties:
                      clusterName:
                        type: string
                      clusterGroup:
                        type: string
                provisionCluster:
                  type: object
                  description: Ask for a cluster to be created for this instance. Not yet acted on.
                  properties:
                    enabled:
                      type: boolean
                    name:
                      type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
