---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appinstances.appsplus.io
spec:
  conversion:
    strategy: None
  group: appsplus.io
  names:
    categories:
      - appsplus
    kind: AppInstance
    listKind: AppInstanceList
    plural: appinstances
    shortNames:
      - apinst
    singular: appinstance
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.app
          name: App
          type: string
        - jsonPath: .spec.namespace
          name: Namespace
          type: string
        - jsonPath: .status.bundleName
          name: Bundle
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            spec:
              properties:
                app:
                  description: Name of the App this is an instance of.
                  type: string
                namespace:
                  description: Namespace the rendered resources land in on each target.
                  type: string
                provisionCluster:
                  description: Create a cluster for this instance rather than deploying to existing ones. The cluster is owned by the instance, so deleting the instance deletes it. An instance owns at most one cluster, and deploys only to that one.
                  properties:
                    enabled:
                      type: boolean
                    name:
                      description: Defaults to the instance name.
                      type: string
                  type: object
                targets:
                  description: Which existing clusters to deploy to.
                  items:
                    properties:
                      clusterGroup:
                        type: string
                      clusterName:
                        type: string
                    type: object
                  type: array
                values:
                  description: Overrides the App's values. Substituted into templates as ${key}.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              required:
                - app
              type: object
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
          type: object
      served: true
      storage: true
      subresources:
        status: {}
